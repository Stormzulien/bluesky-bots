<!DOCTYPE html>
<html>
  <head>
    <title>List rules</title>
    <style>
      html { scroll-behavior: smooth; }

      body {
        user-select: none;
        font-family: Arial;
      }

      pre#main {
        background-color: lightgrey;
        padding: 10px;
        user-select: text;
      }

      button, input[type=checkbox] {
        cursor: pointer;
        user-select: none;
      }

      #template {
        font-family: monospace;
        width: 300px;
      }

      #replace-char {
        font-family: monospace;
        width: 20px;
      }

      .padding {
        margin-inline: 10px;
      }

      #copy-btn {
        position: fixed;
        right: 10px;
      }

      label {
        color: #383838;
        font-size: 0.9em;
      }

      #whitespace {
        width: 40px;
      }

      #sep {
        width: 20px;
      }
    </style>
  </head>
  <body>
    <button onclick="formatted()" title="Formatted like: #rule#">Formatted</button>
    <button onclick="plain()" title="Basic list">Plain</button>

    <span class="padding">|</span>

    <button onclick="asArray()" title="JSON Array">Array</button>

    <span class="padding"></span>

    <input type="checkbox" id="newlines" checked="true" title="Separate items with \n"> <label for="newlines" title="Separate items with \n">Newlines</label>

    <span class="padding"></span>

    <span>Whitespace:</span>
    <input type="text" id="whitespace">
    <button onclick="document.querySelector('#whitespace').value = '\t'" title="Set whitespace as \t (Tab character)">Tab</button>

    <span class="padding">|</span>
    
    <input type="text" placeholder="template" id="template">

    <span>Replace char:</span>
    <input type="text" maxlength="2" id="replace-char">
    <button onclick="forReplies()">For replies</button>

    <span class="padding">|</span>
    <button onclick="listAll()" title="List all in original (imported) order">List all</button>
    <input type="text" id="sep" value=",\n">

    <button id="copy-btn" onclick="navigator.clipboard.writeText(document.querySelector('pre#main').innerText)">Copy</button>

    <pre id="main"></pre>

    <script type="module">
      "use strict";

      import main from "./main.json" with { type: "json" };

      /* 
        Might add: ?cmd:rule.item, ?cmd:rule[item] or ?cmd:rule#item
        Also a ["#rule#", "#rule#", "#rule#"] option
      */

      // const defaultRule = "origin";
      const excluded = ["set-14", "very-rare", "term-filter", "special-19"];
      const rules = Object.keys(main)
        .filter(r => !(excluded.includes(r) || r.includes("test")));

      const mainElem = document.querySelector("pre#main");
      const templateElem = document.querySelector("#template");
        templateElem.value = "(?<=\\\\s|^)\\\\?post:%r(?:\\\\s.*)?$";
      const replaceCharElem = document.querySelector("#replace-char");
        replaceCharElem.value = "%r";
      const whitespace = document.querySelector("#whitespace");
        whitespace.value = "  ";
      const newlines = document.querySelector("#newlines");

      function sort(a, b) { // make dashes come first
        const cA = (a.match(/-/g) || []).length;
        const cB = (b.match(/-/g) || []).length;
        return cB - cA;
      }

      const sorted = rules.sort(sort);

      const sorted0 = Object.keys(main).sort(sort);

      /*
      document.body.innerHTML = `
      <div style="
        position: fixed;
        top: 0;
        user-select: none;
        background-color: white;
        padding: 5px 8px;
        width: 100%;
        border-bottom: 1px solid grey;
      ">
        <a href="#top">sorted</a> | <a href="#sorted0">sorted0</a>
      </div>
      <pre style="margin-top: 30px;" id="sorted">${sorted.join("\n")}</pre>
      <pre style="padding-top: 30px;" id="sorted0">${sorted0.join("\n")}</pre>`;
      document.body.style.userSelect = "text";
      */

      // button functions

      function forReplies() {
        let result = "";

        sorted0.forEach((r, i) => {
          // result += `  "(?<=\\\\s|^)\\\\?post:\\\\s*${r}(?:\\\\s.*)?$": "#${r}#",\n`;

          // console.log(!main[sorted0[i]].length);

          let e;

          if (excluded.includes(r)) {
            e = `\\\\[${r}\\\\] Rule has been excluded`;
          } else if (r.substring(0, 4) === "test") {
            e = `\\\\[${r}\\\\] Test rule has been excluded`;
          } else if (!main[sorted0[i]].length) {
            e = `\\\\[${r}\\\\] Rule has no items (empty)`;
          } else {
            e = `#${r}#`;
          }

          result += `"${templateElem.value.replaceAll(replaceCharElem.value, r)}": "${e}",\n`;
        });

        // result += `  "${templateElem.value.replaceAll(replaceCharElem.value, "default")}": "#${defaultRule}#",\n`;
        mainElem.innerHTML = result;
      }

      function formatted() { mainElem.innerHTML = ("#" + rules.join("#\n#") + "#"); }

      function plain() { mainElem.innerHTML = rules.join("\n"); }

      function asArray() {
        if (newlines.checked) {
          mainElem.innerHTML = (`[\n${whitespace.value}"` + rules.join(`",\n${whitespace.value}"`) + '"\n]');
        } else {
          mainElem.innerHTML = (`["` + rules.join(`","`) + '"]');
        }
      }

      function listAll() {
        mainElem.innerHTML = 
          Object.keys(main).join(
            document.querySelector("#sep").value
            .replace(/\\n/g, "\n")
          );
      }

      function urlEncoder() {
        const str = " `¬¦\"£$^&+=€:;@<>?/áéíóúÁÉÍÓÚ|".split("");

        let stacked = "";

        stacked += `.replace(%,%25)`;

        str.forEach(e => {
          stacked += `.replace(${e},${encodeURIComponent(e)})`;
        });

        stacked += `.replace(',%27).replace(\\#,%23).replace(\\n,%0A).replace(!,%21)`;

        const output = "#_input" + stacked + "#";

        return output;
      }

      // script[type=module]

      Object.assign(window, { forReplies, formatted, plain, asArray, listAll, urlEncoder });

    </script>
  </body>
</html>
